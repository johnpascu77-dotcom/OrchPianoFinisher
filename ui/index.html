<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrchPiano Finisher</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6; --accent:#2f6fdb; --accent-ink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181a; --panel:#212326; --ink:#e8e8e4; --muted:#9a9a94; --line:#34363a; --accent:#5b92f0; --accent-ink:#0d0e10; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,"Segoe UI",sans-serif; height:100vh; display:grid; grid-template-columns:340px 1fr; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:16px; }
  main { display:flex; flex-direction:column; min-width:0; height:100vh; }
  h1 { font-size:17px; margin:0 0 14px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 8px; }
  label { display:block; margin:8px 0 2px; font-size:12px; color:var(--muted); }
  select, input[type=number], input[type=text] { width:100%; padding:5px 7px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:5px; font:inherit; }
  select:disabled, input:disabled { opacity:.45; }
  .check { display:flex; gap:8px; align-items:center; margin:8px 0; font-size:13px; }
  .check input { margin:0; } .check label { margin:0; color:inherit; font-size:13px; }
  button { font:inherit; padding:6px 12px; border-radius:5px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; width:100%; margin-top:18px; padding:8px; }
  button:disabled { opacity:.45; cursor:default; }
  #drop { border:2px dashed var(--line); border-radius:8px; padding:16px; text-align:center; color:var(--muted); cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--accent); } #drop b { color:var(--ink); }
  .hint { font-size:11px; color:var(--muted); margin-top:2px; }
  .toolbar { padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; gap:10px; align-items:center; flex-wrap:wrap; min-height:50px; }
  .toolbar .spacer { flex:1; }
  #status { font-size:12px; color:var(--muted); } #status.err { color:#d33; }
  #dragchip { display:none; padding:5px 12px; border:1px dashed var(--accent); border-radius:99px; color:var(--accent); cursor:grab; font-size:13px; user-select:none; }
  #dlink { display:none; }
  #log { flex:1; margin:0; padding:12px 14px; overflow:auto; font:12px/1.4 ui-monospace,Consolas,monospace; white-space:pre-wrap; color:var(--muted); }
</style>
</head>
<body>
<aside>
  <h1>OrchPiano Finisher</h1>
  <div id="drop"><b>Drop a captured .mid</b> or click to choose<input id="file" type="file" accept=".mid,.midi" hidden></div>
  <div id="fileinfo" class="hint"></div>

  <h2>Capture</h2>
  <label for="track">Track</label>
  <select id="track" disabled></select>
  <div class="check"><input type="checkbox" id="chauto" checked><label for="chauto">Channel base: auto-detect (lowest channel on the track)</label></div>
  <input type="number" id="chbase" min="0" max="12" value="0" disabled>
  <label for="sig">Time signature</label>
  <input type="text" id="sig" placeholder="auto">
  <div class="hint" id="sighint"></div>

  <h2>OrchPiano assumptions</h2>
  <label for="span">Max hand span (semitones)</label>
  <input type="number" id="span" min="5" max="24" value="14">
  <label for="notes">Notes per hand</label>
  <input type="number" id="notes" min="1" max="10" value="4">

  <h2>Output</h2>
  <label for="format">Format</label>
  <select id="format"><option value="mid">MIDI (one piano, one channel)</option><option value="musicxml">MusicXML</option></select>
  <div class="check"><input type="checkbox" id="dyn" checked disabled><label for="dyn">Velocity dynamics marks (MusicXML only)</label></div>
  <label for="scale">Notation scale (2.0 only for a too-fine grid)</label>
  <input type="number" id="scale" min="0.25" max="8" step="0.25" value="1">

  <button class="primary" id="run" disabled>Run Finisher</button>
</aside>
<main>
  <div class="toolbar">
    <span id="status">Drop a capture to begin.</span>
    <span class="spacer"></span>
    <span id="dragchip" title="Drag this into Explorer, Dorico or a DAW (Chrome / Edge)">&#8674; drag the file out</span>
    <a id="dlink"><button>Download</button></a>
  </div>
  <pre id="log"></pre>
</main>
<script>
const $ = id => document.getElementById(id);
let fileId = null;

function setStatus(t, err) { $('status').textContent = t; $('status').classList.toggle('err', !!err); }

$('chauto').onchange = () => { $('chbase').disabled = $('chauto').checked; };
$('format').onchange = () => { $('dyn').disabled = $('format').value !== 'musicxml'; };

async function upload(file) {
  setStatus('Reading…');
  const res = await fetch('/api/upload', { method: 'POST', body: await file.arrayBuffer(), headers: { 'X-Filename': file.name } });
  const d = await res.json();
  if (d.error) return setStatus(d.error, true);
  fileId = d.file_id;
  $('fileinfo').textContent = `${file.name} — ${d.tracks.length} track(s), note channels ${d.channels.join(', ') || 'none'}`;
  const sel = $('track'); sel.innerHTML = ''; sel.disabled = false;
  if (d.auto_track === null) sel.append(new Option('— choose a track —', ''));
  d.tracks.forEach(t => sel.append(new Option(`${t.index}: ${t.name || '(unnamed)'} — ${t.note_events} note events`, t.index)));
  sel.value = d.auto_track === null ? '' : d.auto_track;
  $('sighint').textContent = d.time_signatures.length
    ? `Detected: ${d.time_signatures.join(', ')} (leave blank to use it)`
    : 'None found in the capture — 4/4 is assumed unless you enter one.';
  $('run').disabled = false;
  hideResult();
  setStatus('Ready.');
  if (d.auto_track !== null) run();
}

function hideResult() { $('dragchip').style.display = 'none'; $('dlink').style.display = 'none'; }

async function run() {
  if (!fileId) return;
  setStatus('Running…'); $('run').disabled = true; hideResult();
  const body = {
    file_id: fileId, track: $('track').value, format: $('format').value,
    channel_base: $('chauto').checked ? null : $('chbase').value,
    time_signature: $('sig').value, max_hand_span: +$('span').value, max_hand_notes: +$('notes').value,
    dynamics: $('dyn').checked, notation_scale: +$('scale').value, label: 'finished'
  };
  const res = await fetch('/api/run', { method: 'POST', body: JSON.stringify(body) });
  const d = await res.json();
  $('run').disabled = false;
  $('log').textContent = d.log || d.error || '';
  if (!d.ok) return setStatus('The Finisher stopped — see the log.', true);
  setStatus(`${d.download_name} — ${(d.bytes / 1024).toFixed(1)} KB`);
  const href = '/api/download/' + d.out_id;
  const a = $('dlink'); a.href = href; a.download = d.download_name; a.style.display = '';
  const chip = $('dragchip'); chip.style.display = 'inline-block'; chip.draggable = true;
  chip.ondragstart = e => {
    const url = new URL(href, location.href).href;
    e.dataTransfer.setData('DownloadURL', `${d.mime}:${d.download_name}:${url}`);   // Chrome / Edge write a real file on drop
    e.dataTransfer.setData('text/uri-list', url);
    e.dataTransfer.effectAllowed = 'copy';
  };
}
$('run').onclick = run;

const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) upload(e.target.files[0]); };
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) upload(f); });
</script>
</body>
</html>
